name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event.repository.name == 'codex-paper-newsletter'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - shell: powershell
        run: .\scripts\build_release.ps1
      - shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\* --generate-notes --verify-tag
