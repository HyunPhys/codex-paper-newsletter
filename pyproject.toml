[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-newsletter"
version = "0.1.0"
description = "Daily RSS-based personalized paper newsletter generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Byunghyun Kim", email = "bhkim133@gmail.com" },
]
keywords = ["rss", "papers", "newsletter", "codex", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
paper-newsletter = "paper_newsletter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["paper_newsletter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
